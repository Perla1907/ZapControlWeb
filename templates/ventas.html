<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ventas - ZapControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/modulos.css">
</head>
<body>
    <!-- Barra superior -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-2">
                <button class="btn-menu" id="btnMenu" type="button" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
                <a class="navbar-brand mb-0 h1" href="dashboard.html"><img src="img/logo.png" alt="" width="28" height="28" class="me-2">ZapControl</a>
            </div>
            <div class="d-flex align-items-center gap-3 text-white small">
                <span id="nombreUsuario" class="fw-semibold"></span>
                <span id="rolUsuario" class="pildora"></span>
                <button type="button" id="btnSalir" class="btn btn-sm btn-outline-light">Salir</button>
            </div>
        </div>
    </nav>

    <div class="d-flex contenedor-principal">
        <!-- Barra lateral -->
        <aside class="sidebar">
            <nav class="nav flex-column gap-1" aria-label="Menú principal">
                <a class="nav-link" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a class="nav-link" href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
                <a class="nav-link" href="categorias.html" data-solo-admin><i class="bi bi-tags"></i> Categorías</a>
                <a class="nav-link" href="inventario.html"><i class="bi bi-archive"></i> Inventario</a>
                <a class="nav-link" href="catalogo.html"><i class="bi bi-grid"></i> Catálogo</a>
                <a class="nav-link active" href="ventas.html"><i class="bi bi-cart"></i> Ventas</a>
                <a class="nav-link" href="reportes.html" data-solo-admin><i class="bi bi-bar-chart"></i> Reportes</a>
                <a class="nav-link" href="usuarios.html" data-solo-admin><i class="bi bi-people"></i> Usuarios</a>
            </nav>
        </aside>

        <!-- Contenido de la pantalla -->
        <main class="contenido flex-grow-1">
            <header class="bg-white border-bottom px-4 py-3"><h1 class="h5 mb-0">Historial de ventas</h1></header>
            <section id="contenidoDinamico" class="p-4">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
                    <div class="d-flex flex-wrap gap-2">
                        <input id="buscarVenta" type="search" class="form-control" style="max-width:300px" placeholder="Buscar por folio, producto, vendedor o pago" aria-label="Buscar ventas">
                        <input id="filtroFecha" type="date" class="form-control" style="max-width:170px" aria-label="Filtrar por día">
                        <button type="button" id="btnLimpiar" class="btn">Limpiar</button>
                    </div>
                    <a href="nueva_venta.html" class="btn btn-primario">+ Nueva venta</a>
                </div>

                <div id="mensaje" aria-live="polite"></div>

                <div class="tarjeta"><div class="tabla-scroll"><table style="min-width:820px">
                    <thead><tr><th>Folio</th><th>Fecha y hora</th><th>Vendedor</th><th>Productos</th><th>Pago</th><th>Total</th><th class="acciones">Acciones</th></tr></thead>
                    <tbody id="tablaVentas"></tbody>
                </table></div></div>
                <p class="nota" id="resumenVentas"></p>

                <!-- Ticket -->
                <dialog id="dlgTicket">
                    <div class="modal-cab">Ticket de venta</div>
                    <div class="modal-cuerpo" id="ticketContenido"></div>
                    <div class="modal-pie">
                        <button type="button" class="btn btn-primario" id="btnImprimirTicket">Imprimir</button>
                        <span class="sep"></span>
                        <button type="button" class="btn" id="btnCerrarTicket">Cerrar</button>
                    </div>
                </dialog>

                <!-- Confirmar eliminación -->
                <dialog id="dlgEliminar">
                    <div class="modal-cab">Eliminar venta</div>
                    <div class="modal-cuerpo"><p class="mb-0" id="textoEliminar"></p></div>
                    <div class="modal-pie">
                        <span class="sep"></span>
                        <button type="button" class="btn" id="btnCancelarEliminar">Cancelar</button>
                        <button type="button" class="btn btn-peligro" id="btnConfirmarEliminar">Eliminar</button>
                    </div>
                </dialog>

                <!-- Hoja que se imprime (estilos.css oculta todo lo demás) -->
                <div id="hojaEtiquetas" class="hoja-etiquetas"></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/panel.js"></script>
    <script src="model/modelo_categorias.js"></script>
    <script src="model/modelo_productos.js"></script>
    <script src="model/modelo_ventas.js"></script>
    <script src="views/vista_comun.js"></script>
    <script src="views/vista_ticket.js"></script>
    <script src="controller/controlador_ventas.js"></script>
</body>
</html>
