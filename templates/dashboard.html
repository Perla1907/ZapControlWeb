<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ZapControl</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="stylesheet" href="css/modulos.css">
</head>
<body>
    <!-- Barra superior -->
    <nav class="navbar navbar-dark">
        <div class="container-fluid">
            <div class="d-flex align-items-center gap-2">
                <button class="btn-menu" id="btnMenu" type="button" aria-label="Abrir menú"><i class="bi bi-list"></i></button>
                <a class="navbar-brand mb-0 h1" href="dashboard.html"><img src="img/logo.png" alt="" width="28" height="28" class="me-2">ZapControl</a>
            </div>
            <div class="d-flex align-items-center gap-3 text-white small">
                <span id="nombreUsuario" class="fw-semibold"></span>
                <span id="rolUsuario" class="pildora"></span>
                <button type="button" id="btnSalir" class="btn btn-sm btn-outline-light">Salir</button>
            </div>
        </div>
    </nav>

    <div class="d-flex contenedor-principal">
        <!-- Barra lateral -->
        <aside class="sidebar">
            <nav class="nav flex-column gap-1" aria-label="Menú principal">
                <a class="nav-link active" href="dashboard.html"><i class="bi bi-speedometer2"></i> Dashboard</a>
                <a class="nav-link" href="productos.html"><i class="bi bi-box-seam"></i> Productos</a>
                <a class="nav-link" href="categorias.html" data-solo-admin><i class="bi bi-tags"></i> Categorías</a>
                <a class="nav-link" href="inventario.html"><i class="bi bi-archive"></i> Inventario</a>
                <a class="nav-link" href="catalogo.html"><i class="bi bi-grid"></i> Catálogo</a>
                <a class="nav-link" href="ventas.html"><i class="bi bi-cart"></i> Ventas</a>
                <a class="nav-link" href="reportes.html" data-solo-admin><i class="bi bi-bar-chart"></i> Reportes</a>
                <a class="nav-link" href="usuarios.html" data-solo-admin><i class="bi bi-people"></i> Usuarios</a>
            </nav>
        </aside>

        <!-- Contenido de la pantalla -->
        <main class="contenido flex-grow-1">
            <header class="bg-white border-bottom px-4 py-3"><h1 class="h5 mb-0">Dashboard</h1></header>
            <section id="contenidoDinamico" class="p-4">
            <h2 class="h4 mb-4">Resumen general</h2>
            <div class="row g-3 mb-4">
                <div class="col-6 col-lg-3"><div class="tarjeta p-3 mt-0"><div class="text-secondary">Productos</div><div class="fs-2 fw-bold" id="statProductos">0</div></div></div>
                <div class="col-6 col-lg-3"><div class="tarjeta p-3 mt-0"><div class="text-secondary">Pares disponibles</div><div class="fs-2 fw-bold" id="statPares">0</div></div></div>
                <div class="col-6 col-lg-3"><div class="tarjeta p-3 mt-0"><div class="text-secondary">Categorías</div><div class="fs-2 fw-bold" id="statCategorias">0</div></div></div>
                <div class="col-6 col-lg-3"><div class="tarjeta p-3 mt-0"><div class="text-secondary" id="statVentasTitulo">Ventas de hoy</div><div class="fs-2 fw-bold" id="statVentas">0</div><small class="text-secondary" id="statVentasTotal">$0.00 vendidos</small></div></div>
            </div>
            <h3 class="h6">Existencias bajas</h3>
            <div class="tarjeta"><div class="tabla-scroll"><table>
                <thead><tr><th>Producto</th><th>Color</th><th>Talla</th><th>Existencias</th></tr></thead>
                <tbody id="tablaBajas"></tbody>
            </table></div></div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/sesion.js"></script>
    <script src="js/panel.js"></script>
    <script src="model/modelo_categorias.js"></script>
    <script src="model/modelo_productos.js"></script>
    <script src="model/modelo_ventas.js"></script>
    <script src="views/vista_comun.js"></script>
    <script src="controller/controlador_dashboard.js"></script>
</body>
</html>
